name: Feature request
description: An idea for something Steward could do.
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want
      description: Describe the feature in a few lines.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it help you do on a trip? A real example helps.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Which screen?"
      options:
        - "flights (home, next trips, travel day)"
        - "add flight (flight number and day)"
        - "found in your calendar"
        - "share a booking to steward"
        - "read a boarding pass (screenshot, pdf, wallet pass)"
        - "flight screen (map, timeline, times)"
        - "your plane (delay risk)"
        - "connections"
        - "boarding pass screen"
        - "pass on the lock screen"
        - "live update on the lock screen"
        - "status bar chip"
        - "alerts (gate, delay, take off, landing, belt)"
        - "reminders (check in, leave, boarding)"
        - "cancelled or diverted flight"
        - "share eta and the live link"
        - "passport and the globe"
        - "next flight widget"
        - "boarding pass tile (quick settings)"
        - "app shortcuts"
        - "settings: ready for your trips"
        - "settings: tell me about"
        - "settings: time to the airport, from where i am"
        - "settings: boarding pass"
        - "settings: finding flights (calendar)"
        - "settings: how it looks"
        - "plans page and the trial"
        - "settings: your plan, restore purchase"
        - "settings: your data (download, delete)"
        - "settings: help, write to me"
        - "accessibility (talkback, text size)"
        - "other"
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Pictures or links
      description: A sketch, a screenshot or a link to something similar.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and this idea is not there yet.
          required: true
